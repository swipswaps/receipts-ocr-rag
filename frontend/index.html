<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipts OCR + RAG + Agent</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 1200px; margin: 20px auto; padding: 20px; background: #0f0f1a; color: #e0e0e0; }
        h1 { color: #00d4ff; }
        .status { padding: 12px 20px; border-radius: 8px; margin: 15px 0; font-weight: 600; }
        .online { background: #0a2a1a; border: 1px solid #4caf50; color: #4caf50; }
        .offline { background: #2a0a0a; border: 1px solid #ff6b35; color: #ff6b35; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #1a1a2e; padding: 20px; border-radius: 12px; border: 1px solid #2a2a40; }
        .card h3 { color: #ffcc00; margin-top: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stats { display: flex; gap: 15px; flex-wrap: wrap; margin: 10px 0; }
        .stat { background: #0f0f1a; padding: 8px 16px; border-radius: 6px; font-size: 13px; }
        .stat strong { color: #00d4ff; }
        .file-drop { border: 2px dashed #2a2a40; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .file-drop.dragover { border-color: #00d4ff; background: #0a1a2a; }
        .file-drop input { display: none; }
        .file-drop .icon { font-size: 40px; }
        .file-drop .hint { color: #666; font-size: 13px; }
        .upload-item { display: flex; align-items: center; padding: 8px 12px; background: #0f0f1a; border-radius: 6px; margin: 4px 0; gap: 10px; font-size: 13px; }
        .upload-item .name { flex: 1; word-break: break-all; }
        .upload-item .status-badge { font-size: 11px; padding: 2px 10px; border-radius: 12px; }
        .status-badge.complete { background: #0a3a1a; color: #4caf50; }
        .status-badge.processing { background: #1a2a0a; color: #ffcc00; }
        .status-badge.failed { background: #3a0a0a; color: #ff6b35; }
        .progress-bar { width: 80px; height: 4px; background: #2a2a40; border-radius: 2px; overflow: hidden; }
        .progress-bar .fill { height: 100%; background: #00d4ff; transition: width 0.5s; }
        .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #4a4a7a; color: white; }
        .btn-primary:hover { background: #5a5a8a; }
        .btn-secondary { background: #2a2a40; color: #aaa; }
        .btn-secondary:hover { background: #3a3a50; }
        .query-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .query-row input { flex: 1; padding: 10px 14px; background: #0f0f1a; border: 1px solid #2a2a40; border-radius: 8px; color: #e0e0e0; font-size: 14px; min-width: 200px; }
        .query-row input:focus { outline: none; border-color: #00d4ff; }
        .result-item { background: #0f0f1a; padding: 12px 16px; border-radius: 8px; margin: 8px 0; border-left: 3px solid #4a4a7a; }
        .result-item .meta { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
        .result-item .text { font-size: 13px; color: #ccc; line-height: 1.5; }
        .result-item .score { background: #1a1a2e; padding: 2px 10px; border-radius: 12px; }
        .agg-result { background: #0a2a1a; padding: 15px; border-radius: 8px; border: 1px solid #4caf50; font-size: 18px; color: #4caf50; text-align: center; }
        .scan-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #0f0f1a; border-radius: 4px; margin: 3px 0; font-size: 13px; }
        .scan-item .badge { background: #1a1a2e; padding: 2px 10px; border-radius: 12px; font-size: 11px; color: #888; }
        .chat-history { max-height: 200px; overflow-y: auto; background: #0a0a15; border-radius: 8px; padding: 10px; margin-top: 10px; }
        .chat-entry { padding: 6px 8px; border-bottom: 1px solid #1a1a2e; font-size: 13px; }
        .chat-entry .q { color: #00d4ff; }
        .chat-entry .a { color: #aaa; }
        .session-info { font-size: 12px; color: #666; margin-top: 5px; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; background: #1a2a1a; border: 1px solid #4caf50; color: #4caf50; opacity: 0; transition: 0.5s; }
        .toast.show { opacity: 1; }
        .toast.error { background: #2a1a1a; border-color: #ff6b35; color: #ff6b35; }
        .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .filter-row input, .filter-row select { padding: 6px 12px; background: #0f0f1a; border: 1px solid #2a2a40; border-radius: 6px; color: #e0e0e0; font-size: 13px; }
        .empty-state { text-align: center; color: #555; padding: 20px; }
        .suggested-queries { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .suggested-queries button { background: #1a1a2e; border: 1px solid #2a2a40; color: #888; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; }
        .suggested-queries button:hover { border-color: #00d4ff; color: #00d4ff; }
    </style>
</head>
<body>

    <h1>📄 Receipts OCR + RAG + Agent</h1>
    <p style="color:#666;">Upload receipts, ask questions, get insights</p>

    <div id="status" class="status offline">⏳ Checking backend...</div>

    <div class="stats" id="stats">
        <span class="stat">📄 Documents: <strong id="docCount">0</strong></span>
        <span class="stat">💸 Total Spend: <strong id="totalSpend">$0</strong></span>
        <span class="stat">🏷️ Vendors: <strong id="vendorCount">0</strong></span>
    </div>

    <div class="grid">
        <!-- Upload Panel -->
        <div class="card">
            <h3>📤 Upload & Process</h3>
            <div class="file-drop" id="dropzone">
                <div class="icon">📁</div>
                <div>Drop files here or click to browse</div>
                <div class="hint">Supports .txt, .json, .png, .jpg (max 50MB)</div>
                <input type="file" id="fileInput" multiple accept=".txt,.json,.png,.jpg,.jpeg">
            </div>
            <div class="upload-list" id="uploadList"></div>
            <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="clearCompleted()">Clear Completed</button>
                <button class="btn btn-secondary" onclick="refreshScans()">↻ Refresh</button>
                <button class="btn btn-secondary" onclick="newSession()">🔄 New Chat</button>
            </div>
        </div>

        <!-- Query Panel -->
        <div class="card">
            <h3>🔍 RAG Query</h3>
            <div class="query-row">
                <input type="text" id="queryInput" placeholder="Ask about your receipts..." onkeydown="if(event.key==='Enter')chatQuery()">
                <select id="topK"><option value="5">Top 5</option><option value="10">Top 10</option></select>
                <button class="btn btn-primary" id="queryBtn" onclick="chatQuery()">Search</button>
            </div>
            <div class="suggested-queries">
                <button onclick="setQuery('Show total spending')">💸 Total</button>
                <button onclick="setQuery('Breakdown by vendor')">🏷️ Vendors</button>
                <button onclick="setQuery('Expenses last 30 days')">📅 Recent</button>
                <button onclick="setQuery('Find duplicate charges')">🔁 Duplicates</button>
                <button onclick="setQuery('Food category spending')">🍔 Food</button>
            </div>
            <div id="ragResults"></div>
            <div id="chatHistory" class="chat-history"></div>
            <div class="session-info" id="sessionInfo">Session: <span id="sessionId">new</span></div>
        </div>

        <!-- Scans List -->
        <div class="card" style="grid-column:1/3;">
            <h3>📋 Document Library</h3>
            <div class="filter-row">
                <input type="text" id="filterInput" placeholder="Filter by filename..." oninput="filterScans()">
                <select id="statusFilter" onchange="filterScans()"><option value="all">All</option><option value="with-vendor">With Vendor</option><option value="with-amount">With Amount</option></select>
            </div>
            <div class="scan-list" id="scanList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'http://localhost:5001';
        let sessionId = localStorage.getItem('rag_session') || 'session_' + Date.now();
        localStorage.setItem('rag_session', sessionId);
        document.getElementById('sessionId').textContent = sessionId;

        let uploads = {};

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.className = 'toast', 4000);
        }

        async function checkStatus() {
            try {
                const res = await fetch(API_BASE);
                const data = await res.json();
                document.getElementById('status').className = 'status online';
                document.getElementById('status').textContent = '✅ Backend Online — ' + data.documents + ' documents indexed';
                document.getElementById('docCount').textContent = data.documents || 0;
                const stats = await fetch(API_BASE + '/rag/stats').then(r => r.json());
                document.getElementById('totalSpend').textContent = '$' + (stats.total_spend || 0).toFixed(2);
                document.getElementById('vendorCount').textContent = stats.total_vendors || 0;
            } catch (e) {
                document.getElementById('status').className = 'status offline';
                document.getElementById('status').textContent = '❌ Backend Offline';
            }
        }

        function setQuery(q) { document.getElementById('queryInput').value = q; chatQuery(); }

        async function uploadFiles(files) {
            for (const file of files) {
                const id = file.name + '_' + Date.now();
                uploads[id] = { name: file.name, status: 'pending', progress: 0, size: file.size };
                renderUploads();
                const formData = new FormData();
                formData.append('file', file);
                const xhr = new XMLHttpRequest();
                xhr.open('POST', API_BASE + '/scan');
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        uploads[id].progress = Math.round((e.loaded / e.total) * 100);
                        uploads[id].status = 'processing';
                        renderUploads();
                    }
                };
                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        uploads[id].status = 'complete';
                        uploads[id].progress = 100;
                        uploads[id].result = data;
                        showToast('✅ ' + file.name + ' uploaded (' + (data.chunks || 0) + ' chunks)');
                        refreshScans();
                        checkStatus();
                    } else {
                        uploads[id].status = 'failed';
                        showToast('❌ ' + file.name + ': upload failed', true);
                    }
                    renderUploads();
                };
                xhr.onerror = () => {
                    uploads[id].status = 'failed';
                    renderUploads();
                    showToast('❌ ' + file.name + ': network error', true);
                };
                xhr.send(formData);
            }
        }

        function renderUploads() {
            const list = document.getElementById('uploadList');
            const entries = Object.values(uploads);
            if (entries.length === 0) { list.innerHTML = '<div class="empty-state">No uploads yet</div>'; return; }
            list.innerHTML = entries.map(u => `
                <div class="upload-item">
                    <span class="name">${u.name}</span>
                    <div class="progress-bar"><div class="fill" style="width:${u.progress||0}%"></div></div>
                    <span class="status-badge ${u.status}">${u.status === 'processing' ? u.progress+'%' : u.status}</span>
                    ${u.status === 'failed' ? '<span style="color:#ff6b35;">error</span>' : ''}
                </div>
            `).join('');
        }

        function clearCompleted() {
            Object.keys(uploads).forEach(k => {
                if (uploads[k].status === 'complete' || uploads[k].status === 'failed') delete uploads[k];
            });
            renderUploads();
        }

        function newSession() {
            sessionId = 'session_' + Date.now();
            localStorage.setItem('rag_session', sessionId);
            document.getElementById('sessionId').textContent = sessionId;
            document.getElementById('chatHistory').innerHTML = '';
            document.getElementById('ragResults').innerHTML = '';
            showToast('🔄 New session created');
        }

        async function chatQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) { showToast('Enter a query first', true); return; }
            const topK = parseInt(document.getElementById('topK').value) || 5;
            const btn = document.getElementById('queryBtn');
            btn.textContent = '⏳ Searching...';
            btn.disabled = true;
            try {
                const res = await fetch(API_BASE + '/rag/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query, session_id: sessionId, top_k: topK })
                });
                const data = await res.json();
                const container = document.getElementById('ragResults');
                let html = '';
                if (data.response && data.response.length > 0) {
                    const first = data.response[0];
                    if (first.type === 'aggregation') {
                        html = `<div class="agg-result">💰 ${first.value} ${first.unit}</div>`;
                    } else if (first.type === 'filtered' && first.documents) {
                        html = first.documents.slice(0, topK).map(d => `
                            <div class="result-item">
                                <div class="meta"><span>📄 ${d[1]}</span></div>
                                <div class="text">${(d[2]||'').substring(0, 300)}...</div>
                            </div>
                        `).join('');
                    } else {
                        html = data.response.map(r => `
                            <div class="result-item">
                                <div class="meta"><span>📄 ${r.filename}</span><span class="score">score: ${(r.score||0).toFixed(4)}</span></div>
                                <div class="text">${(r.text||'').substring(0, 400)}${(r.text||'').length > 400 ? '...' : ''}</div>
                            </div>
                        `).join('');
                    }
                } else {
                    html = '<div class="empty-state">No results found</div>';
                }
                container.innerHTML = html;
                // Update chat history
                const hist = document.getElementById('chatHistory');
                const entry = document.createElement('div');
                entry.className = 'chat-entry';
                entry.innerHTML = `<div class="q">👤 ${query}</div><div class="a">🤖 ${data.response && data.response.length > 0 ? 'Found ' + data.response.length + ' results' : 'No results'}</div>`;
                hist.prepend(entry);
                document.getElementById('queryInput').value = '';
            } catch (e) {
                showToast('Error: ' + e.message, true);
            }
            btn.textContent = 'Search';
            btn.disabled = false;
        }

        async function refreshScans() {
            try {
                const res = await fetch(API_BASE + '/rag/scans');
                const data = await res.json();
                const list = document.getElementById('scanList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty-state">No scans uploaded yet</div>';
                    return;
                }
                const filtered = data.filter(s => {
                    const f = document.getElementById('filterInput').value.toLowerCase();
                    const st = document.getElementById('statusFilter').value;
                    if (f && !s.filename.toLowerCase().includes(f)) return false;
                    if (st === 'with-vendor' && !s.vendor) return false;
                    if (st === 'with-amount' && !s.amount) return false;
                    return true;
                });
                list.innerHTML = filtered.map(s => `
                    <div class="scan-item">
                        <span>📄 ${s.filename}</span>
                        <span>${s.vendor ? '🏷️ ' + s.vendor : ''} ${s.amount ? '💲' + s.amount : ''} <span class="badge">${s.category || 'uncategorized'}</span></span>
                    </div>
                `).join('');
            } catch (e) { document.getElementById('scanList').innerHTML = '<div style="color:#ff6b35;">Error loading scans</div>'; }
        }

        function filterScans() { refreshScans(); }

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) uploadFiles(e.target.files);
            fileInput.value = '';
        });

        checkStatus();
        refreshScans();
        setInterval(checkStatus, 15000);
    </script>
</body>
</html>
