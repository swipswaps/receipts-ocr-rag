- hosts: localhost
  connection: local
  become: false

  vars:
    project_root: "{{ playbook_dir }}/.."
    data_dir: "{{ project_root }}/data"
    models_dir: "{{ project_root }}/models"
    db_path: "{{ data_dir }}/scans.db"

  tasks:
    - name: Ensure data directory exists
      file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure models directory exists
      file:
        path: "{{ models_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure database schema is initialized
      command:
        cmd: |
          python3 -c '
          import sqlite3
          conn = sqlite3.connect("{{ db_path }}")
          cur = conn.cursor()
          cur.execute("CREATE TABLE IF NOT EXISTS scans (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT, text TEXT, structured JSON, embedding BLOB, timestamp TEXT)")
          cur.execute("CREATE TABLE IF NOT EXISTS actions (id INTEGER PRIMARY KEY AUTOINCREMENT, action TEXT, params JSON, result TEXT, timestamp TEXT)")
          cur.execute("CREATE TABLE IF NOT EXISTS embeddings_index (id INTEGER PRIMARY KEY AUTOINCREMENT, text TEXT, embedding BLOB, metadata JSON, timestamp TEXT)")
          conn.commit()
          conn.close()
          print("Database initialized at {{ db_path }}")
          '
      register: db_init
      changed_when: "'initialized' in db_init.stdout"

    - name: Initialize Terraform
      shell:
        cmd: "terraform init"
        chdir: "{{ project_root }}/infra"

    - name: Apply Terraform
      shell:
        cmd: "terraform apply -auto-approve"
        chdir: "{{ project_root }}/infra"

    - name: Start Docker Compose stack
      shell:
        cmd: "docker compose -f {{ project_root }}/docker-compose.yml up -d"
        chdir: "{{ project_root }}"

    - name: Verify backend health
      uri:
        url: "http://localhost:5001/health"
        method: GET
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 15
      delay: 5

    - name: Display access information
      debug:
        msg: |
          Application available at: http://localhost:5173
          Backend API: http://localhost:5001
          API Documentation: http://localhost:5001/docs
